<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Boy - Premium Admin Login</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* High-quality dark food background from Unsplash */
            background: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dark overlay for better readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        /* Glassmorphism Card */
        .login-glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #ffffff;
        }

        .login-glass-card h2 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-glass-card p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff8a00;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 138, 0, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 20px rgba(229, 46, 113, 0.3);
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(229, 46, 113, 0.5);
        }

        .error-message {
            color: #ff4c4c;
            font-size: 13px;
            margin-top: 20px;
            display: none;
            background: rgba(255, 76, 76, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 76, 76, 0.3);
        }
    </style>
</head>
<body>

    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Login Card -->
    <div class="login-glass-card">
        <h2>Local Boy</h2>
        <p>Admin Portal Workspace</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" required placeholder="Admin Email Address">
            </div>
            
            <div class="input-group">
                <input type="password" id="password" required placeholder="Master Password">
            </div>
            
            <button type="submit" id="loginBtn">ACCESS DASHBOARD</button>
            <div id="errorMsg" class="error-message"></div>
        </form>
    </div>

    <!-- Firebase SDKs using ES Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
            messagingSenderId: "184676228358",
            appId: "1:184676228358:web:c2b32b68debeeadadfd287",
            measurementId: "G-E3TT96ZH1T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); 
            
            const originalText = loginBtn.innerText;
            loginBtn.innerText = "AUTHENTICATING...";
            loginBtn.style.opacity = "0.8";

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log("Logged in user:", user.email);
                    window.location.href = "dashboard.html"; 
                })
                .catch((error) => {
                    loginBtn.innerText = originalText;
                    loginBtn.style.opacity = "1";
                    errorMsg.style.display = "block";
                    
                    if(error.code === 'auth/invalid-credential') {
                        errorMsg.innerText = "Incorrect email or password. Please try again.";
                    } else {
                        errorMsg.innerText = error.message;
                    }
                });
        });
    </script>
</body>
</html>
