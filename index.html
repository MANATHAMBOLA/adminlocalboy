<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Boy - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: radial-gradient(circle at center, #1a1a2e, #121212); 
            color: #ffffff; 
            overflow: hidden; 
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .logo-section h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .logo-section p {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #888;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            background: rgba(0, 0, 0, 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        #errorMsg {
            color: #ff4c4c;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            background: rgba(255, 76, 76, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 76, 76, 0.2);
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-section">
            <h1>Local Boy</h1>
            <p>Admin Control Panel</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Admin Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter admin email address" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login to Dashboard</button>
            <div id="errorMsg"></div>
        </form>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        // MEE FIREBASE CONSOLE NUNDI EXACT CONFIG NI IKKADA PASTE CHEYANDI
        const firebaseConfig = {
            apiKey: "MEE_API_KEY_IKKADA_PETTANDI",
            authDomain: "MEE_AUTH_DOMAIN_IKKADA_PETTANDI",
            databaseURL: "MEE_DATABASE_URL_IKKADA_PETTANDI",
            projectId: "MEE_PROJECT_ID_IKKADA_PETTANDI",
            storageBucket: "MEE_STORAGE_BUCKET_IKKADA_PETTANDI",
            messagingSenderId: "MEE_MESSAGING_SENDER_ID",
            appId: "MEE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Auto-login check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    errorDiv.style.display = 'none';
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    errorDiv.innerText = error.message.replace("Firebase: ", "");
                    errorDiv.style.display = 'block';
                    
                    btn.innerHTML = 'Login to Dashboard';
                    btn.style.opacity = '1';
                    btn.disabled = false;
                    
                    const card = document.querySelector('.login-card');
                    card.style.transform = 'translateX(-10px)';
                    setTimeout(() => card.style.transform = 'translateX(10px)', 100);
                    setTimeout(() => card.style.transform = 'translateX(0)', 200);
                });
        });
    </script>
</body>
</html>
